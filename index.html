<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greyhound Predictions</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🐕 Greyhound Predictions</h1>
      <div class="date-nav">
        <button id="prevDay" title="Previous day">&larr;</button>
        <input type="date" id="datePicker">
        <button id="nextDay" title="Next day">&rarr;</button>
      </div>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Loading predictions…</div>
    <div id="error" class="error" hidden></div>

    <!-- Summary bar -->
    <section id="summaryBar" class="summary-bar" hidden>
      <div class="stat"><span id="statDate" class="stat-value"></span><span class="stat-label">Date</span></div>
      <div class="stat"><span id="statStates" class="stat-value">0</span><span class="stat-label">States</span></div>
      <div class="stat"><span id="statRaces" class="stat-value">0</span><span class="stat-label">Races</span></div>
      <div class="stat"><span id="statDogs" class="stat-value">0</span><span class="stat-label">Runners</span></div>
      <div class="stat highlight"><span id="statHC" class="stat-value">0</span><span class="stat-label">High Conf</span></div>
    </section>

    <!-- High confidence picks -->
    <section id="hcSection" hidden>
      <h2>⭐ High Confidence Picks</h2>
      <div id="hcPicks" class="picks-grid"></div>
    </section>

    <!-- State tabs -->
    <section id="statesSection" hidden>
      <div id="stateTabs" class="state-tabs"></div>
      <div id="stateContent" class="state-content"></div>
    </section>
  </main>

  <footer>
    <p>Predictions generated by ML models. Not financial advice. Gamble responsibly.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
